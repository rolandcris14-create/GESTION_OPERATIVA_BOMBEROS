<style>/* Laboratorio de Decisiones · The ResusLab
   Tokens de marca tomados del kit del curso (config/curso.json). */
:root {
  --rojo: #B3151B; --rojo-oscuro: #8E1116; --rojo-tinte: #FBECEC;
  --tinta: #1B1C1D; --texto: #262626; --gris: #6B6B6B; --linea: #D6D3D1;
  --fondo: #F5F4F3; --panel: #FFFFFF;
  --ambar-fondo: #FFF8E1; --ambar-borde: #E0C36A; --ambar-texto: #7A6000;
  --verde: #1E7A46; --verde-tinte: #E6F4EC; --azul: #1F5F9E; --azul-tinte: #E8F0FA;
  --radio: 12px; --sombra: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --tinta: #F2F1F0; --texto: #E4E2E0; --gris: #A8A5A2; --linea: #3A3836;
    --fondo: #161514; --panel: #211F1E; --rojo-tinte: #3A1A1B;
    --ambar-fondo: #33290F; --ambar-borde: #7A6420; --ambar-texto: #F0D68A;
    --verde-tinte: #13301F; --verde: #5FCB8C; --azul-tinte: #16263A; --azul: #8AB8EA;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fondo); color: var(--texto); font: 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
h1, h2, h3, h4 { font-family: Montserrat, Inter, system-ui, sans-serif; color: var(--tinta); line-height: 1.2; }
a { color: var(--rojo); }
button { font: inherit; cursor: pointer; }
.contenedor { max-width: 980px; margin: 0 auto; padding: 0 16px; }

/* Cabecera */
header.barra { background: var(--tinta); color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) header.barra { background: #0D0C0C; } }
header.barra .contenedor { display: flex; align-items: center; gap: 12px; min-height: 60px; }
header.barra img { width: 34px; height: 34px; }
header.barra .t1 { font: 700 15px Montserrat, sans-serif; color: #fff; }
header.barra .t2 { font-size: 12px; color: #FFD9D9; }
header.barra .progreso-global { margin-left: auto; font-size: 13px; color: #ddd; text-align: right; }
header.barra a { color: inherit; text-decoration: none; }

/* Mapa del curso */
.intro { padding: 28px 0 8px; }
.intro h1 { font-size: clamp(24px, 4vw, 34px); margin: 0 0 8px; }
.intro p { max-width: 70ch; color: var(--gris); margin: 0 0 8px; }
.parte { margin: 26px 0 8px; font: 700 12px Inter; letter-spacing: .12em; text-transform: uppercase; color: var(--rojo); }
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.tarjeta-cap { text-decoration: none; background: var(--panel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px 16px; box-shadow: var(--sombra); text-align: left; color: inherit; display: flex; flex-direction: column; gap: 6px; transition: transform .12s, border-color .12s; }
.tarjeta-cap:hover { transform: translateY(-2px); border-color: var(--rojo); }
.tarjeta-cap .num { font: 800 12px Montserrat; color: var(--rojo); letter-spacing: .08em; }
.tarjeta-cap .tit { font: 700 16px Montserrat; color: var(--tinta); }
.tarjeta-cap .mision { font-size: 13.5px; color: var(--gris); }
.tarjeta-cap.pendiente { opacity: .55; cursor: default; }
.barrita { height: 6px; background: var(--linea); border-radius: 3px; overflow: hidden; margin-top: auto; }
.barrita > i { display: block; height: 100%; background: var(--rojo); }
.barrita.ok > i { background: var(--verde); }

/* Capítulo */
.cap-cab { padding: 22px 0 6px; }
.cap-cab .volver { background: none; border: 0; color: var(--rojo); padding: 0; font-weight: 600; }
.cap-cab h1 { font-size: clamp(22px, 3.6vw, 30px); margin: 8px 0 6px; }
.caja { border-radius: var(--radio); padding: 12px 16px; margin: 12px 0; border: 1px solid var(--linea); background: var(--panel); }
.caja.objetivo { border-left: 5px solid var(--rojo); }
.caja.escena { background: var(--ambar-fondo); border-color: var(--ambar-borde); }
.caja.escena b { color: var(--ambar-texto); }
.caja .rot { font: 700 11px Inter; letter-spacing: .1em; text-transform: uppercase; color: var(--rojo); display: block; margin-bottom: 2px; }
.pestanas { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; margin: 10px 0 0; scrollbar-width: thin; }
.pestanas button { flex: 0 0 auto; border: 1px solid var(--linea); background: var(--panel); color: var(--texto); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.pestanas button.activa { background: var(--tinta); color: var(--fondo); border-color: var(--tinta); }
.pestanas button .chk { color: var(--verde); font-weight: 700; margin-left: 4px; }
.actividad { background: var(--panel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 18px; margin: 10px 0 40px; box-shadow: var(--sombra); }
.actividad > h2 { margin: 0 0 4px; font-size: 21px; }
.actividad .tipo { font: 700 11px Inter; letter-spacing: .1em; text-transform: uppercase; color: var(--gris); }
.instr { color: var(--gris); margin: 6px 0 14px; }

/* Controles */
.btn { border: 0; background: var(--rojo); color: #fff; border-radius: 8px; padding: 10px 18px; font-weight: 600; }
.btn:hover { background: var(--rojo-oscuro); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sec { background: transparent; color: var(--tinta); border: 1px solid var(--linea); }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.opcion { display: block; width: 100%; text-align: left; border: 1px solid var(--linea); background: var(--panel); color: var(--texto); border-radius: 8px; padding: 10px 14px; margin: 6px 0; }
.opcion:hover:not(:disabled) { border-color: var(--rojo); }
.opcion.sel { border-color: var(--tinta); box-shadow: inset 0 0 0 1px var(--tinta); }
.opcion.bien { background: var(--verde-tinte); border-color: var(--verde); }
.opcion.mal { background: var(--rojo-tinte); border-color: var(--rojo); }
.fb { border-radius: 8px; padding: 10px 14px; margin-top: 10px; font-size: 15px; }
.fb.bien { background: var(--verde-tinte); border-left: 4px solid var(--verde); }
.fb.mal { background: var(--rojo-tinte); border-left: 4px solid var(--rojo); }
.fb.info { background: var(--azul-tinte); border-left: 4px solid var(--azul); }
input[type=number], input[type=text], select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--linea); border-radius: 8px; background: var(--panel); color: var(--texto); }
input[type=number] { width: 110px; }
input[type=range] { width: 100%; accent-color: var(--rojo); }
.cifra { display: inline-block; background: var(--ambar-fondo); border: 1px solid var(--ambar-borde); color: var(--ambar-texto); border-radius: 8px; padding: 6px 12px; font-weight: 700; margin: 4px 6px 4px 0; }
.cifra small { display: block; font-weight: 500; font-size: 11px; }
.pregunta-n { font-size: 13px; color: var(--gris); }
.enunciado { font-weight: 600; margin: 4px 0 8px; color: var(--tinta); }
.resultado { text-align: center; padding: 18px 8px; }
.resultado .nota { font: 800 42px Montserrat; color: var(--rojo); }
.resultado.ok .nota { color: var(--verde); }
table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 8px 0; }
table.t th, table.t td { border-bottom: 1px solid var(--linea); padding: 6px 8px; text-align: left; vertical-align: top; }
table.t th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--gris); }
.tabla-scroll { overflow-x: auto; }

/* Caso ramificado */
.linea-tiempo { display: flex; gap: 4px; margin-bottom: 12px; }
.linea-tiempo i { flex: 1; height: 5px; border-radius: 3px; background: var(--linea); }
.linea-tiempo i.hecho { background: var(--rojo); }
.monitor { background: #0F1412; color: #9EF2B5; border-radius: 10px; padding: 10px 14px; font: 600 14px ui-monospace, Menlo, Consolas, monospace; display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 8px 0; }
.monitor span b { color: #fff; font-weight: 700; margin-left: 4px; }
.datos { margin: 6px 0; }
.experto { background: var(--fondo); border-radius: 8px; padding: 10px 14px; margin-top: 10px; font-style: italic; border-left: 4px solid var(--tinta); }
.experto::before { content: "Razonamiento experto: "; font-style: normal; font-weight: 700; }

/* Clasificar */
.item-clas { border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px; margin: 8px 0; background: var(--panel); }
.item-clas .txt { font-weight: 600; margin-bottom: 6px; }
.item-clas .bots { display: flex; gap: 6px; flex-wrap: wrap; }
.item-clas .bots button { border: 1px solid var(--linea); background: var(--fondo); color: var(--texto); border-radius: 999px; padding: 5px 12px; font-size: 14px; }
.item-clas .bots button.sel { background: var(--tinta); color: var(--fondo); }
.item-clas.bien { border-color: var(--verde); background: var(--verde-tinte); }
.item-clas.mal { border-color: var(--rojo); background: var(--rojo-tinte); }
.item-clas .porque { font-size: 14px; margin-top: 6px; }

/* Ordenar */
.orden li { list-style: none; display: flex; align-items: center; gap: 8px; border: 1px solid var(--linea); background: var(--panel); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
.orden { padding: 0; margin: 0; }
.orden li .n { font: 800 14px Montserrat; color: var(--rojo); width: 22px; }
.orden li .txt { flex: 1; }
.orden li button { border: 1px solid var(--linea); background: var(--fondo); color: var(--texto); border-radius: 6px; width: 34px; height: 30px; }
.orden li.bien { border-color: var(--verde); background: var(--verde-tinte); }
.orden li.mal { border-color: var(--rojo); background: var(--rojo-tinte); }

/* Tarjetas */
.flash { perspective: 1000px; min-height: 180px; cursor: pointer; margin: 8px 0; }
.flash .cara { border: 1px solid var(--linea); border-radius: var(--radio); padding: 24px; min-height: 180px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 18px; background: var(--panel); }
.flash .cara.rev { background: var(--ambar-fondo); border-color: var(--ambar-borde); font-size: 16px; }

/* Barra de probabilidad */
.prob-barra { position: relative; height: 26px; border-radius: 6px; background: linear-gradient(90deg, var(--verde-tinte), var(--ambar-fondo), var(--rojo-tinte)); border: 1px solid var(--linea); margin: 8px 0 22px; }
.prob-barra .marca { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--tinta); border-radius: 2px; }
.prob-barra .marca.post { background: var(--rojo); }
.prob-barra .marca span { position: absolute; top: 32px; left: 50%; transform: translateX(-50%); font-size: 12px; white-space: nowrap; font-weight: 700; }
.prob-barra .umbral { position: absolute; top: 0; bottom: 0; border-left: 2px dashed var(--gris); }
.prob-barra .umbral span { position: absolute; top: -18px; left: 2px; font-size: 11px; color: var(--gris); white-space: nowrap; }
.pie { color: var(--gris); font-size: 13px; padding: 20px 0 40px; border-top: 1px solid var(--linea); margin-top: 30px; }
.fila { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.col2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 680px) { .col2 { grid-template-columns: 1fr; } .actividad { padding: 14px; } }
select { max-width: 100%; }
.prob-barra .marca:first-child span, .prob-barra .marca span { max-width: 45vw; }
</style></head><body><div id="app"></div>
<script>/* Laboratorio de Decisiones · motor común.
   Cada capítulo se registra con TDC.registrar({...}) desde capitulos/cNN.js.
   Tipos de actividad: quiz, caso, numero, clasificar, ordenar, tarjetas, personalizado.
   Cada actividad devuelve una nota de 0 a 1; el capítulo se aprueba con 80 % de promedio. */
(function () {
  'use strict';
  var NOTA_MINIMA = 0.8;
  var CLAVE = 'tdc-lab-v1';
  var capitulos = {};
  var PARTES = {
    I: 'El problema del diagnóstico en la escena',
    II: 'Matemática clínica: razonar con probabilidades',
    III: 'La mente en la emergencia',
    IV: 'Arquitectura del diagnóstico y de la decisión',
    V: 'Mitigación del error y seguridad del paciente',
    VI: 'Aplicación: el estándar de evaluación del paciente prehospitalario'
  };
  var INDICE = [
    [1, 'I', 'El método clínico y el error diagnóstico'], [2, 'I', 'Semiología basada en la evidencia'],
    [3, 'II', 'Probabilidad y pensamiento en frecuencias'], [4, 'II', 'Precisión diagnóstica'],
    [5, 'II', 'Cocientes de verosimilitud, Bayes y POCUS'], [6, 'II', 'Reglas de decisión y escalas'],
    [7, 'III', 'Proceso dual, carga cognitiva y estrés'], [8, 'III', 'Heurísticas y sesgos cognitivos'],
    [9, 'III', 'Emociones y juicio clínico'], [10, 'IV', 'De novato a experto'],
    [11, 'IV', 'Reconocimiento de patrones y decisión naturalista'], [12, 'IV', 'Evaluación estructurada y patologías tiempo-dependientes'],
    [13, 'IV', 'Umbral terapéutico y disposición'], [14, 'V', 'Metacognición y calibración'],
    [15, 'V', 'Mitigación de sesgos y puntos de parada'], [16, 'V', 'Factores humanos y trabajo en equipo'],
    [17, 'V', 'Casos integradores'], [18, 'VI', 'Principios transversales de la atención'],
    [19, 'VI', 'Del despacho al examen físico'], [20, 'VI', 'Del juicio clínico a la transferencia']
  ];

  /* ---------- utilidades ---------- */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'html') el.innerHTML = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) anadir(el, arguments[i]);
    return el;
  }
  function anadir(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { anadir(el, x); }); return; }
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  function fmt(x, dec) {
    if (dec == null) dec = 0;
    return Number(x).toFixed(dec).replace('.', ',');
  }
  function num(s) { return parseFloat(String(s).replace(',', '.')); }
  function barajar(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  var bayes = {
    odds: function (p) { return p / (1 - p); },
    prob: function (o) { return o / (1 + o); },
    post: function (p, lr) { var o = p / (1 - p) * lr; return o / (1 + o); },
    lrPos: function (se, es) { return se / (1 - es); },
    lrNeg: function (se, es) { return (1 - se) / es; }
  };
  /* Barra de probabilidad con marcas (previa, posterior) y umbrales opcionales. */
  function barraProb(marcas, umbrales) {
    var b = h('div', { class: 'prob-barra', role: 'img', 'aria-label': 'Escala de probabilidad de 0 a 100 %' });
    (umbrales || []).forEach(function (u) {
      b.appendChild(h('div', { class: 'umbral', style: 'left:' + (u.p * 100) + '%' }, h('span', null, u.t)));
    });
    (marcas || []).forEach(function (m) {
      b.appendChild(h('div', { class: 'marca ' + (m.clase || ''), style: 'left:calc(' + (Math.max(0, Math.min(1, m.p)) * 100) + '% - 1px)' },
        h('span', null, m.t)));
    });
    return b;
  }

  /* ---------- almacenamiento ---------- */
  var estado = {};
  try { estado = JSON.parse(localStorage.getItem(CLAVE) || '{}') || {}; } catch (e) { estado = {}; }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch (e) { /* sin almacenamiento */ } }
  function notaAct(cap, i) { return (estado[cap] || {})[i]; }
  function ponerNota(cap, i, nota) {
    estado[cap] = estado[cap] || {};
    var prev = estado[cap][i];
    if (prev == null || nota > prev) estado[cap][i] = nota;
    guardar();
  }
  function avanceCap(n) {
    var c = capitulos[n]; if (!c) return { hechas: 0, total: 0, prom: 0 };
    var total = c.actividades.length, hechas = 0, suma = 0;
    for (var i = 0; i < total; i++) { var v = notaAct(n, i); if (v != null) { hechas++; suma += v; } }
    return { hechas: hechas, total: total, prom: total ? suma / total : 0 };
  }

  /* ---------- tipos de actividad ---------- */
  var tipos = {};

  tipos.quiz = function (act, el, fin) {
    var preg = act.barajar === false ? act.preguntas : barajar(act.preguntas);
    var i = 0, aciertos = 0;
    function mostrar() {
      el.innerHTML = '';
      if (i >= preg.length) return fin(aciertos / preg.length, aciertos + ' de ' + preg.length + ' respuestas correctas');
      var q = preg[i], respondida = false;
      el.appendChild(h('div', { class: 'pregunta-n' }, 'Pregunta ' + (i + 1) + ' de ' + preg.length));
      el.appendChild(h('div', { class: 'enunciado', html: q.p }));
      var cont = h('div'), fbx = h('div');
      var idx = q.opciones.map(function (_, k) { return k; });
      if (q.barajar !== false) idx = barajar(idx);
      var botones = [];
      idx.forEach(function (k) {
        var b = h('button', { class: 'opcion', html: q.opciones[k], onclick: function () {
          if (respondida) return; respondida = true;
          var ok = k === q.correcta; if (ok) aciertos++;
          botones.forEach(function (x) { x.b.disabled = true; if (x.k === q.correcta) x.b.classList.add('bien'); });
          if (!ok) b.classList.add('mal');
          fbx.appendChild(h('div', { class: 'fb ' + (ok ? 'bien' : 'mal'), html: (ok ? '<b>Correcto.</b> ' : '<b>No.</b> ') + (q.explicacion || '') }));
          fbx.appendChild(h('div', { class: 'acciones' }, h('button', { class: 'btn', onclick: function () { i++; mostrar(); } }, i + 1 < preg.length ? 'Siguiente' : 'Ver resultado')));
        } });
        botones.push({ b: b, k: k }); cont.appendChild(b);
      });
      el.appendChild(cont); el.appendChild(fbx);
    }
    mostrar();
  };

  /* Caso por fases. Cada fase: {titulo, datos (html), monitor {FC:..}, decision}
     decision.tipo: 'opcion' {opciones, correcta, explicacion, parcial:[idx]}
                    'probabilidad' {rango:[min,max], explicacion}  (valores en %)
                    'multiple' {opciones, correctas:[...], explicacion}
                    ninguna: solo lectura.  Además cada fase puede traer 'experto'. */
  tipos.caso = function (act, el, fin) {
    var f = 0, puntos = 0, evaluables = 0;
    function cab() {
      var lt = h('div', { class: 'linea-tiempo' });
      act.fases.forEach(function (_, k) { lt.appendChild(h('i', { class: k < f ? 'hecho' : '' })); });
      return lt;
    }
    function siguiente(extra) {
      return h('div', { class: 'acciones' }, h('button', { class: 'btn', onclick: function () { f++; mostrar(); } },
        f + 1 < act.fases.length ? 'Continuar el caso' : 'Cerrar el caso'), extra);
    }
    function mostrar() {
      el.innerHTML = '';
      if (f >= act.fases.length) {
        if (act.cierre) el.appendChild(h('div', { class: 'caja objetivo', html: '<span class="rot">Lección operativa</span>' + act.cierre }));
        return fin(evaluables ? puntos / evaluables : 1, evaluables ? 'Decisiones acertadas: ' + fmt(puntos, puntos % 1 ? 1 : 0) + ' de ' + evaluables : '');
      }
      var fase = act.fases[f];
      el.appendChild(cab());
      if (f === 0 && act.presentacion) el.appendChild(h('div', { class: 'caja escena', html: act.presentacion }));
      el.appendChild(h('h3', { style: 'margin:6px 0' }, fase.titulo || ('Tiempo ' + (f + 1))));
      if (fase.monitor) {
        var m = h('div', { class: 'monitor' });
        for (var k in fase.monitor) m.appendChild(h('span', null, k, h('b', null, fase.monitor[k])));
        el.appendChild(m);
      }
      if (fase.datos) el.appendChild(h('div', { class: 'datos', html: fase.datos }));
      var d = fase.decision, zona = h('div');
      el.appendChild(zona);

  /* Simulador: el alumno arma el diagnóstico de trabajo componente a componente. */
  function constructorDT(el, api) {
    var h = api.h;
    var casos = api.barajar(CASOS_DT), ci = 0, k = 0, bien = 0, total = 0, frase = [];
    function pintar() {
      el.innerHTML = '';
      if (ci >= casos.length) {
        return api.fin(bien / total, bien + ' de ' + total + ' componentes bien elegidos en ' + casos.length + ' diagnósticos de trabajo', true);
      }
      var cs = casos[ci], comp = cs.comp[k];
      el.appendChild(h('div', { class: 'pregunta-n' }, 'Caso ' + (ci + 1) + ' de ' + casos.length + ' · componente ' + (k + 1) + ' de 6'));
      el.appendChild(h('div', { class: 'caja escena', html: '<span class="rot">' + cs.titulo + '</span>' + cs.datos }));
      var borrador = h('div', { class: 'datos', html: '<b>Diagnóstico de trabajo:</b> ' + (frase.length ? frase.join('; ') + '…' : '<span class="pregunta-n">(en construcción)</span>') });
      el.appendChild(borrador);
      el.appendChild(h('div', { class: 'enunciado' }, (k + 1) + '. ' + comp.c));
      var zona = h('div');
      var orden = api.barajar([0, 1, 2]);
      var bots = [];
      orden.forEach(function (idx) {
        var b = h('button', { class: 'opcion', onclick: function () {
          bots.forEach(function (x) { x.b.disabled = true; if (x.i === 0) x.b.classList.add('bien'); });
          var ok = idx === 0; total++; if (ok) bien++; else b.classList.add('mal');
          zona.appendChild(h('div', { class: 'fb ' + (ok ? 'bien' : 'mal'), html: (ok ? '<b>Correcto.</b> ' : '<b>No.</b> ') + comp.porque }));
          frase.push(comp.ops[0]);
          var ultimo = k === 5;
          zona.appendChild(h('div', { class: 'acciones' }, h('button', { class: 'btn', onclick: function () {
            if (ultimo) { mostrarFinal(); } else { k++; pintar(); }
          } }, ultimo ? 'Ver el diagnóstico completo' : 'Siguiente componente')));
        } }, comp.ops[idx]);
        bots.push({ b: b, i: idx });
        el.appendChild(b);
      });
      el.appendChild(zona);
    }
    function mostrarFinal() {
      el.innerHTML = '';
      var cs = casos[ci];
      el.appendChild(h('div', { class: 'pregunta-n' }, 'Caso ' + (ci + 1) + ' de ' + casos.length + ' · diagnóstico de trabajo completo'));
      el.appendChild(h('div', { class: 'caja objetivo', html: '<span class="rot">' + cs.titulo + '</span>«' + frase.join('; ') + '.»' }));
      el.appendChild(h('div', { class: 'pregunta-n' }, 'Seis componentes: síndrome, gravedad, trayectoria, hipótesis más probable, hipótesis peligrosa no descartada y decisión. Se reescribe en cada reevaluación.'));
      el.appendChild(h('div', { class: 'acciones' }, h('button', { class: 'btn', onclick: function () { ci++; k = 0; frase = []; pintar(); } },
        ci + 1 < casos.length ? 'Siguiente caso' : 'Ver resultado')));
    }
    pintar();
  }

  function reglaCanadiense(el, api) {
    var h = api.h;
    var cartas = api.barajar(api.barajar(CCR_NO).slice(0, 2).concat(api.barajar(CCR_APLICA).slice(0, 4)));
    var i = 0, suma = 0, perfectas = 0;
    function carta() {
      el.innerHTML = '';
      if (i >= cartas.length) return api.fin(suma / cartas.length, perfectas + ' de ' + cartas.length + ' pacientes resueltos sin errores de secuencia.', false);
      var c = cartas[i], aplica = !c.porqueNo, pasos = 0, bien = 0;
      el.appendChild(h('div', { class: 'pregunta-n' }, 'Paciente ' + (i + 1) + ' de ' + cartas.length));
      el.appendChild(h('div', { class: 'caja', html: c.txt }));
      var zona = h('div'); el.appendChild(zona);
      function pregunta(txt, verdad, explic, luego) {
        var q = h('div', { style: 'margin-top:10px' });
        q.appendChild(h('div', { class: 'enunciado', html: txt }));
        var bs = [true, false].map(function (val) {
          return h('button', { class: 'btn sec', onclick: function () {
            bs.forEach(function (b) { b.disabled = true; });
            pasos++; var ok = val === verdad; if (ok) bien++;
            this.style.borderColor = ok ? 'var(--verde)' : 'var(--rojo)';
            q.appendChild(h('div', { class: 'fb ' + (ok ? 'bien' : 'mal'), html: (ok ? '<b>Correcto.</b> ' : '<b>No. La respuesta es «' + (verdad ? 'Sí' : 'No') + '».</b> ') + explic }));
            luego();
          } }, val ? 'Sí' : 'No');
        });
        q.appendChild(h('div', { class: 'acciones', style: 'margin-top:4px' }, bs));
        zona.appendChild(q);
      }
      function concluir(txt) {
        var nota = pasos ? bien / pasos : 1; suma += nota; if (nota === 1) perfectas++;
        zona.appendChild(h('div', { class: 'fb info', html: '<b>Conclusión:</b> ' + txt }));
        zona.appendChild(h('div', { class: 'acciones' }, h('button', { class: 'btn', onclick: function () { i++; carta(); } }, i + 1 < cartas.length ? 'Siguiente paciente' : 'Ver resultado')));
      }
      pregunta('Antes de aplicar: ¿pertenece a la población de la regla (adulto alerta y estable)?', aplica, aplica ? 'Adulto, alerta y estable: la regla se puede aplicar.' : c.porqueNo, function () {
        if (!aplica) return concluir('la regla no aplica. Mantenga la restricción del movimiento espinal según su protocolo y traslade para evaluación.');
        pregunta('Paso 1. ¿Hay algún factor de alto riesgo? <span class="pregunta-n">(65 años o más, mecanismo peligroso o parestesias)</span>', c.alto, c.altoTxt, function () {
          if (c.alto) return concluir('imagen indicada. No explore la movilidad del cuello.');
          pregunta('Paso 2. ¿Hay algún factor de bajo riesgo que permita explorar la movilidad? <span class="pregunta-n">(colisión trasera simple, sentado, ha caminado, dolor de inicio diferido o sin dolor en la línea media)</span>', c.bajo, c.bajoTxt, function () {
            if (!c.bajo) return concluir('imagen indicada. Sin factores de bajo riesgo no es seguro explorar la rotación.');
            zona.appendChild(h('div', { class: 'datos', style: 'margin-top:10px' }, 'Le pide que rote activamente el cuello: ' + c.rotaTxt));
            pregunta('Paso 3. ¿Puede rotar activamente 45 grados a la izquierda y a la derecha?', c.rota, c.rota ? 'Rotación completa a ambos lados.' : 'No completa la rotación a un lado.', function () {
              concluir(c.rota ? 'no necesita imagen. La regla permite una restricción selectiva del movimiento espinal en lugar de la inmovilización universal.' : 'imagen indicada.');
            });
          });
        });
      });
    }
    carta();
  }

  function tallerRepresentacion(el, api) {
    var h = api.h;
    var casos = api.barajar(RELATOS).slice(0, 4), i = 0, puntos = 0, total = 0;
    function pintar() {
      el.innerHTML = '';
      if (i >= casos.length) return api.fin(puntos / total, puntos + ' de ' + total + ' elementos de la representación correctos', true);
      var c = casos[i], elegido = {}, grupos = [];
      el.appendChild(h('div', { class: 'pregunta-n' }, 'Relato ' + (i + 1) + ' de ' + casos.length));
      el.appendChild(h('div', { class: 'caja escena', html: '<span class="rot">Lo que le dicen en la escena</span>' + c.relato }));
      el.appendChild(h('div', { class: 'enunciado' }, '1. Elija los calificadores semánticos'));
      var filas = c.dims.concat([{ rot: 'Hallazgo clave', ops: c.clave.ops, ok: c.clave.ok }]);
      filas.forEach(function (d, k) {
        var bots = api.barajar(d.ops.map(function (_, j) { return j; })).map(function (j) {
          return h('button', { 'data-j': j, onclick: function () {
            if (corregido) return;
            elegido[k] = j;
            bots.forEach(function (b) { b.classList.toggle('sel', +b.getAttribute('data-j') === j); });
          } }, d.ops[j]);
        });
        var fila = h('div', { class: 'item-clas' }, h('div', { class: 'txt' }, d.rot), h('div', { class: 'bots' }, bots));
        grupos.push(fila);
        el.appendChild(fila);
      });
      var corregido = false, zona = h('div'), aviso = h('span', { class: 'pregunta-n' });
      var bt = h('button', { class: 'btn', onclick: function () {
        if (Object.keys(elegido).length < filas.length) { aviso.textContent = 'Elija una opción en cada fila.'; return; }
        corregido = true; bt.disabled = true; aviso.textContent = '';
        var bien = 0;
        filas.forEach(function (d, k) {
          var ok = elegido[k] === d.ok; if (ok) bien++;
          grupos[k].classList.add(ok ? 'bien' : 'mal');
          if (!ok) grupos[k].appendChild(h('div', { class: 'porque' }, 'Correcto: ' + d.ops[d.ok] + '.'));
        });
        puntos += bien; total += filas.length;
        zona.appendChild(h('div', { class: 'fb info', html: '<b>Representación del problema:</b> «' + c.modelo + '» ' + c.clave.porque }));
        zona.appendChild(h('div', { class: 'enunciado', style: 'margin-top:12px' }, '2. ¿Qué guion de enfermedad activa esta frase en primer lugar?'));
        var ops = [], correctoBt;
        api.barajar(c.guion.ops.map(function (_, j) { return j; })).forEach(function (j) {
          var b = h('button', { class: 'opcion', onclick: function () {
            ops.forEach(function (x) { x.disabled = true; });
            var ok = j === c.guion.ok; total++; if (ok) puntos++;
            correctoBt.classList.add('bien'); if (!ok) this.classList.add('mal');
            zona.appendChild(h('div', { class: 'fb ' + (ok ? 'bien' : 'mal'), html: (ok ? '<b>Correcto.</b> ' : '<b>No.</b> ') + c.nota }));
            zona.appendChild(h('div', { class: 'acciones' }, h('button', { class: 'btn', onclick: function () { i++; pintar(); } }, i + 1 < casos.length ? 'Siguiente relato' : 'Ver resultado')));
          } }, c.guion.ops[j]);
          if (j === c.guion.ok) correctoBt = b;
          ops.push(b);
        });
        ops.forEach(function (b) { zona.appendChild(b); });
      } }, 'Construir la representación');
      el.appendChild(h('div', { class: 'acciones' }, bt, aviso));
      el.appendChild(zona);
    }
    pintar();
  }

  function mapaPericia(el, api) {
    var h = api.h;
    var resp = {}, etapas = {};
    DOMINIOS.forEach(function (d) { resp[d.id] = [null, null, null, null]; });
    var dom = DOMINIOS[0].id;
    var selDom = h('select', { 'aria-label': 'Dominio', onchange: function () { dom = selDom.value; pintarPreg(); } },

    function nombre(id) { for (var k = 0; k < DOMINIOS.length; k++) if (DOMINIOS[k].id === id) return DOMINIOS[k]; }
    function pintarPreg() {
      zonaPreg.innerHTML = '';
      var r = resp[dom];
      PREG_ETAPA.forEach(function (p, k) {
        var bs = ['Sí, casi siempre', 'No'].map(function (t, j) {

          return b;
        });
        zonaPreg.appendChild(h('div', { class: 'item-clas' }, h('div', { class: 'txt' }, (k + 1) + '. ' + p), h('div', { class: 'bots' }, bs)));
      });
      if (r.every(function (x) { return x !== null; })) etapas[dom] = etapaDe(r);
      pintarRes();
    }
    function pintarRes() {
      zonaRes.innerHTML = '';
      var ids = Object.keys(etapas);
      if (!ids.length) return;
      var tabla = h('table', { class: 't' }, h('tr', null, h('th', null, 'Dominio'), h('th', null, 'Etapa estimada'), h('th', null, 'Qué la hace avanzar')));
      ids.forEach(function (id) {

        tabla.appendChild(h('tr', null, h('td', null, nombre(id).n), h('td', null, h('b', null, e.n), h('div', { class: 'pregunta-n' }, 'Riesgo: ' + e.riesgo)), h('td', null, e.avance)));

      zonaRes.appendChild(h('div', { class: 'tabla-scroll' }, tabla));
      zonaRes.appendChild(h('div', { class: 'pregunta-n' }, 'La pericia es específica de dominio: la misma persona puede estar en etapas distintas según el tipo de paciente.'));

    }
    function pintarPlan() {
      /* Elige el dominio con la etapa más baja registrada. */
      var orden = ['nov', 'pa', 'comp', 'prof', 'exp'], peor = null;
      Object.keys(etapas).forEach(function (id) { if (peor === null || orden.indexOf(etapas[id]) < orden.indexOf(etapas[peor])) peor = id; });
      var D = nombre(peor), eleccion = {}, filas = [], botonesPlan = [], corregido = false;
      zonaPlan.innerHTML = '';
      zonaPlan.appendChild(h('div', { class: 'enunciado', style: 'margin-top:14px' }, 'Paso 2. Plan de práctica deliberada para: ' + D.n));
      zonaPlan.appendChild(h('div', { class: 'pregunta-n' }, 'Elija, en cada componente, la opción que cumple los criterios de la práctica deliberada.'));
      PLAN.forEach(function (p, k) {
        var idx = api.barajar([0, 1, 2]);
        var bots = idx.map(function (j) {
          var txt = p.ops[j].replace('{obj}', D.obj).replace('{dom}', D.n.toLowerCase());
          return h('button', { class: 'opcion', 'data-j': j, onclick: function () {
            if (corregido) return;
            eleccion[k] = j;
            bots.forEach(function (b) { b.classList.toggle('sel', +b.getAttribute('data-j') === j); });
          } }, txt);
        });
        botonesPlan.push(bots);
        var fila = h('div', { class: 'item-clas' }, h('div', { class: 'txt' }, (k + 1) + '. ' + p.rot), bots);
        filas.push(fila); zonaPlan.appendChild(fila);

      var aviso = h('span', { class: 'pregunta-n' }), salida = h('div');

        var bien = 0, lineas = [];
        PLAN.forEach(function (p, k) {
          var ok = eleccion[k] === 0; if (ok) bien++;
          filas[k].classList.add(ok ? 'bien' : 'mal');
          botonesPlan[k].forEach(function (b) { b.disabled = true; if (b.getAttribute('data-j') === '0') b.classList.add('bien'); else if (+b.getAttribute('data-j') === eleccion[k]) b.classList.add('mal'); });

      } }, 'Revisar el plan');
      zonaPlan.appendChild(h('div', { class: 'acciones' }, bt, aviso));
      zonaPlan.appendChild(salida);
    }
    pintarPreg();
  }

  function barrido(el, api) {
    var h = api.h;
    var rondas = api.barajar(SINTOMAS).slice(0, 3), r = 0, suma = 0;
    function vivo() { return document.body.contains(el); }
    function ronda() {
      el.innerHTML = '';
      if (r >= rondas.length) return api.fin(suma / rondas.length, 'Barridos completados: ' + rondas.length + ' · precisión media ' + Math.round(suma / rondas.length * 100) + ' %', true);
      var S = rondas[r], lista = api.barajar(S.si.map(function (t) { return { t: t, si: true }; }).concat(S.no.map(function (t) { return { t: t, si: false }; })));
      var marc = {}, restante = 60, cerrado = false;
      el.appendChild(h('div', { class: 'pregunta-n' }, 'Barrido ' + (r + 1) + ' de ' + rondas.length));
      el.appendChild(h('div', { class: 'caja escena', html: '<span class="rot">Síntoma guía: ' + S.s + '</span>' + S.v }));
      var reloj = h('div', { class: 'cifra' }, h('small', null, 'Tiempo restante'), '60 s');
      el.appendChild(h('div', { class: 'fila' }, reloj, h('span', { class: 'pregunta-n' }, 'Marque solo los diagnósticos que no pueden perderse.')));
      var bots = lista.map(function (x, k) {
        return h('button', { class: 'opcion', onclick: function () {
          if (cerrado) return;
          marc[k] = !marc[k]; this.classList.toggle('sel', marc[k]); this.innerHTML = (marc[k] ? '☑ ' : '☐ ') + x.t;
        } }, '☐ ' + x.t);
      });
      bots.forEach(function (b) { el.appendChild(b); });
      var bt = h('button', { class: 'btn', onclick: function () { cerrar(); } }, 'Terminar el barrido');
      var zona = h('div');
      el.appendChild(h('div', { class: 'acciones' }, bt));
      el.appendChild(zona);
      var iv = setInterval(function () {
        if (!vivo()) { clearInterval(iv); return; }
        restante--; reloj.lastChild.textContent = restante + ' s';
        if (restante <= 0) cerrar();
      }, 1000);
      function cerrar() {
        if (cerrado) return; cerrado = true; clearInterval(iv); bt.disabled = true;
        var bien = 0, omit = 0, sobra = 0;
        bots.forEach(function (b, k) {
          b.disabled = true;
          var x = lista[k], m = !!marc[k];
          if (m === x.si) bien++;
          if (x.si && m) b.classList.add('bien');
          else if (x.si) { omit++; b.classList.add('mal'); b.innerHTML = '☐ ' + x.t + ' <b>(omitido)</b>'; }
          else if (m) { sobra++; b.classList.add('mal'); b.innerHTML = '☑ ' + x.t + ' <b>(benigno o frecuente)</b>'; }
        });
        var nota = bien / lista.length;
        suma += nota;
        zona.appendChild(h('div', { class: 'fb ' + (nota === 1 ? 'bien' : nota >= 0.8 ? 'info' : 'mal'), html: '<b>' + bien + ' de ' + lista.length + ' decisiones correctas' + (restante <= 0 ? ' (tiempo agotado)' : ', en ' + (60 - restante) + ' s') + '.</b> ' +
          (omit ? 'Omitió ' + omit + ' diagnóstico' + (omit > 1 ? 's' : '') + ' que no puede perderse. ' : '') +
          (sobra ? 'Incluyó ' + sobra + ' diagnóstico' + (sobra > 1 ? 's' : '') + ' benigno' + (sobra > 1 ? 's' : '') + ': se acepta solo después de descartar lo grave. ' : '') }));
        zona.appendChild(h('div', { class: 'experto', html: 'Datos y pruebas en la escena: ' + S.datos + ' Para cada diagnóstico: ¿qué dato lo haría probable? ¿Lo busqué? Los huecos son las acciones siguientes.' }));
        zona.appendChild(h('div', { class: 'acciones' }, h('button', { class: 'btn', onclick: function () { r++; ronda(); } }, r + 1 < rondas.length ? 'Siguiente síntoma' : 'Ver resultado')));
      }
    }
    ronda();
  }

  function costoRetraso(el, api) {
    var h = api.h, F = api.fmt;
    var modelo = 'iam', basal = 5, minutos = 120, explorado = false;
    var sel = h('select', { 'aria-label': 'Condición', onchange: function () { modelo = sel.value; explorado = true; calc(); } },
      Object.keys(MODELOS).map(function (k) { return h('option', { value: k }, MODELOS[k].n); }));
    el.appendChild(h('div', { class: 'enunciado' }, 'Paso 1. Calculadora'));
    el.appendChild(h('div', { class: 'fila' }, h('b', null, 'Condición:'), sel));
    var vMin = h('b', null, ''), vBas = h('b', null, '');
    var rMin = h('input', { type: 'range', min: 0, max: 360, step: 5, value: minutos, 'aria-label': 'Minutos de retraso', oninput: function () { minutos = +rMin.value; explorado = true; calc(); } });
    var rBas = h('input', { type: 'range', min: 1, max: 15, step: 0.5, value: basal, 'aria-label': 'Riesgo basal', oninput: function () { basal = +rBas.value; explorado = true; calc(); } });
    var filaBas = h('div', null, h('div', { style: 'margin-top:10px' }, 'Riesgo basal de muerte al año: ', vBas), rBas);
    el.appendChild(h('div', { style: 'margin-top:10px' }, 'Retraso: ', vMin));
    el.appendChild(rMin);
    el.appendChild(filaBas);
    var salida = h('div'); el.appendChild(salida);
    function calc() {
      vMin.textContent = minutos + ' min'; vBas.textContent = F(basal, 1) + ' %';
      filaBas.style.display = modelo === 'iam' ? '' : 'none';
      salida.innerHTML = '';
      var c = [];
      if (modelo === 'iam') {
        var n = minutos / 30, R = basal * Math.pow(1.075, n);
        c = [['Periodos de 30 min', F(n, 1)], ['Riesgo con retraso', F(R, 1) + ' %'], ['Muertes extra por 100', F(R - basal, 1)]];
        salida.appendChild(h('div', { class: 'pregunta-n' }, 'R retraso ≈ R basal × 1,075^n: cada 30 minutos aumenta en 7,5 % el riesgo relativo de muerte al año.'));
      } else if (modelo === 'trombec') {
        c = [['Pacientes con más discapacidad', F(minutos / 9, 1) + ' de cada 100']];
        salida.appendChild(h('div', { class: 'pregunta-n' }, 'Por cada 9 minutos de retraso en la reperfusión, 1 de cada 100 pacientes tratados queda con mayor discapacidad.'));
      } else if (modelo === 'ictus') {
        c = [['Neuronas perdidas', F(1.9 * minutos, 0) + ' millones'], ['Envejecimiento equivalente', F(3.6 * minutos / 60, 1) + ' años']];
        salida.appendChild(h('div', { class: 'pregunta-n' }, 'Unos 1,9 millones de neuronas por minuto; cada hora equivale a unos 3,6 años de envejecimiento normal.'));
      } else if (modelo === 'sepsis') {
        var hs = minutos / 60;
        c = [['Horas de demora', F(hs, 1)], ['Odds de muerte multiplicadas por', F(Math.pow(1.04, hs), 2)]];
        salida.appendChild(h('div', { class: 'pregunta-n' }, 'OR 1,04 por hora de demora en completar el paquete inicial y administrar antibióticos.'));
      } else {
        var m = Math.min(minutos, 10);
        c = [['Supervivencia perdida', F(5.5 * m, 1) + ' puntos'], ['Por retraso de RCP', F(2.3 * m, 1)], ['Por desfibrilación', F(1.1 * m, 1)], ['Por soporte avanzado', F(2.1 * m, 1)]];
        salida.appendChild(h('div', { class: 'pregunta-n' }, 'Sin intervenciones, la supervivencia estimada cae unos 5,5 puntos porcentuales por minuto: 2,3 por la RCP, 1,1 por la desfibrilación y 2,1 por el soporte avanzado.' + (minutos > 10 ? ' La estimación lineal se muestra solo hasta 10 minutos.' : '')));
      }
      salida.appendChild(h('div', null, c.map(function (x) { return h('span', { class: 'cifra' }, h('small', null, x[0]), x[1]); })));
      salida.appendChild(h('div', { class: 'pregunta-n' }, 'Cifras aproximadas: sirven para comparar con el tiempo que consume cada acción en la escena.'));
    }
    calc();

    /* Paso 2: dos cálculos. Paso 3: decidir si cada acción se hace en la escena o en ruta. */
    var puntos = 0, total = 0;
    var paso2 = h('div', { style: 'margin-top:18px' });
    el.appendChild(paso2);
    var CALCS = [
      { t: 'Infarto con riesgo basal de muerte al año de 4 % y 90 minutos de retraso en la reperfusión. ¿Riesgo con retraso? (un decimal, en %)', r: 4 * Math.pow(1.075, 3), tol: 0.15, s: '4 × 1,075^3 = 4 × 1,24 = 5,0 %: 1 muerte adicional por cada 100 pacientes.' },

      if (ci >= CALCS.length) return pintarDilemas();
      var q = CALCS[ci];
      paso2.appendChild(h('div', null, q.t));
      var inp = h('input', { type: 'text', inputmode: 'decimal', 'aria-label': 'Respuesta' }), z = h('div');
      var b = h('button', { class: 'btn', onclick: function () {

        var ok = Math.abs(v - q.r) <= q.tol; total++; if (ok) puntos++;
        z.appendChild(h('div', { class: 'fb ' + (ok ? 'bien' : 'mal'), html: (ok ? '<b>Correcto.</b> ' : '<b>Revise.</b> ') + q.s }));
        z.appendChild(h('div', { class: 'acciones' }, h('button', { class: 'btn', onclick: function () { ci++; pintarCalc(); } }, 'Siguiente')));
      } }, 'Comprobar');
      paso2.appendChild(h('div', { class: 'fila', style: 'margin-top:8px' }, inp, b));
      paso2.appendChild(z);
    }
    var dil = api.barajar(DILEMAS).slice(0, 4), di = 0;

  function juegoCalibracion(el, api) {
    var h = api.h, F = api.fmt;
    var N = 10, casos = api.barajar(VINETAS).slice(0, N), i = 0, reg = [];

    function vineta() {
      el.innerHTML = '';
      if (i >= N) return resultado();
      var v = casos[i], elegido = null, conf = 70;
      el.appendChild(h('div', { class: 'pregunta-n' }, 'Viñeta ' + (i + 1) + ' de ' + N + ' · el diagnóstico final se revela al terminar'));
      el.appendChild(h('div', { class: 'datos' }, v.t));
      el.appendChild(h('div', { class: 'enunciado' }, 'Su diagnóstico de trabajo:'));
      var orden = api.barajar(v.op.map(function (_, k) { return k; }));
      var bots = [];
      orden.forEach(function (k) {
        var b = h('button', { class: 'opcion', onclick: function () {
          elegido = k;
          bots.forEach(function (x) { x.b.classList.toggle('sel', x.k === k); });
          bt.disabled = false;
        } }, v.op[k]);
        bots.push({ b: b, k: k });
        el.appendChild(b);
      });
      var val = h('b', null, conf + ' %');
      var r = h('input', { type: 'range', min: 50, max: 100, step: 10, value: conf, 'aria-label': 'Confianza declarada', oninput: function () { conf = +r.value; val.textContent = conf + ' %'; } });
      el.appendChild(h('div', { class: 'fila', style: 'margin-top:12px' }, h('span', null, '¿Qué tan seguro está?'), val));
      el.appendChild(r);
      el.appendChild(h('div', { class: 'pregunta-n' }, '50 % = no lo sé, es una moneda al aire · 100 % = apostaría mi sueldo'));
      var bt = h('button', { class: 'btn', disabled: true, onclick: function () {
        reg.push({ v: v, elegido: elegido, p: conf / 100, ok: elegido === v.ok });
        i++; vineta();
      } }, 'Registrar y seguir');
      el.appendChild(h('div', { class: 'acciones' }, bt));
    }

    function barra(txt, p, color) {
      return h('div', { style: 'margin:3px 0' },
        h('div', { class: 'pregunta-n' }, txt + ': ' + Math.round(p * 100) + ' %'),
        h('div', { style: 'height:10px;border-radius:5px;background:var(--linea);overflow:hidden' },
          h('div', { style: 'height:100%;width:' + Math.round(p * 100) + '%;background:' + color })));
    }

    function resultado() {
      el.innerHTML = '';
      var brier = 0, aciertos = 0;
      reg.forEach(function (r) { var o = r.ok ? 1 : 0; brier += (r.p - o) * (r.p - o); aciertos += o; });
      brier /= reg.length;

      el.appendChild(h('h3', { style: 'margin:4px 0' }, 'Su registro de calibración'));
      var filas = reg.map(function (r, k) {
        return h('tr', null,
          h('td', null, (k + 1) + '. ' + r.v.op[r.elegido]),
          h('td', null, Math.round(r.p * 100) + ' %'),
          h('td', null, r.v.op[r.v.ok]),
          h('td', { style: 'font-weight:700;color:' + (r.ok ? 'var(--verde)' : 'var(--rojo)') }, r.ok ? 'Sí' : 'No'));
      });
      el.appendChild(h('div', { class: 'tabla-scroll' }, h('table', { class: 't', style: 'font-size:13.5px' },
        h('thead', null, h('tr', null, h('th', null, 'Su diagnóstico'), h('th', null, 'Conf.'), h('th', null, 'Final'), h('th', null, 'Acierto'))),
        h('tbody', null, filas))));

      /* Curva de calibración por tramos de confianza */
      var tramos = [{ t: '50 a 60 %', a: 0.5, b: 0.6 }, { t: '70 a 80 %', a: 0.7, b: 0.8 }, { t: '90 a 100 %', a: 0.9, b: 1 }];
      el.appendChild(h('div', { class: 'enunciado', style: 'margin-top:14px' }, 'Confianza declarada frente a exactitud real'));
      var hayExceso = false;
      tramos.forEach(function (tr) {
        var g = reg.filter(function (r) { return r.p >= tr.a - 0.001 && r.p <= tr.b + 0.001; });
        if (!g.length) return;
        var confMedia = g.reduce(function (s, r) { return s + r.p; }, 0) / g.length;
        var exac = g.filter(function (r) { return r.ok; }).length / g.length;
        var dif = confMedia - exac, lectura;
        if (dif > 0.1) { lectura = 'Exceso de confianza'; hayExceso = true; }
        else if (dif < -0.1) lectura = 'Falta de confianza';
        else lectura = 'Bien calibrado';
        el.appendChild(h('div', { class: 'caja' },
          h('b', null, 'Tramo ' + tr.t + ' · ' + g.length + (g.length === 1 ? ' caso' : ' casos') + ' · ' + lectura),
          barra('Confianza media', confMedia, 'var(--ambar-borde)'),
          barra('Exactitud real', exac, dif > 0.1 ? 'var(--rojo)' : 'var(--verde)')));
      });

      el.appendChild(h('div', null,
        h('span', { class: 'cifra' }, h('small', null, 'Aciertos'), aciertos + ' de ' + reg.length),
        h('span', { class: 'cifra' }, h('small', null, 'Puntuación de Brier'), F(brier, 2)),
        h('span', { class: 'cifra' }, h('small', null, 'Referencia: declarar siempre 50 %'), '0,25')));

      var msj;
      if (brier <= 0.1) msj = '<b>Buena calibración.</b> Su confianza acompañó a la evidencia: alta donde los datos convergían y más baja donde había datos discordantes.';
      else if (brier < 0.25) msj = '<b>Calibración aceptable, con margen.</b> Revise abajo los errores cometidos con confianza alta: son los que más penalizan.';
      else msj = '<b>Peor que declarar siempre 50 %.</b> La confianza puesta en los errores le está penalizando. Aplique las cuatro preguntas antes de declarar una certeza alta.';
      el.appendChild(h('div', { class: 'fb ' + (brier <= 0.1 ? 'bien' : brier < 0.25 ? 'info' : 'mal'), html: msj + (hayExceso ? ' En al menos un tramo su confianza superó su exactitud en más de 10 puntos: exceso de confianza.' : '') }));

      var caros = reg.filter(function (r) { return !r.ok && r.p >= 0.8; });
      var dudas = reg.filter(function (r) { return r.ok && r.p <= 0.6; });
      if (caros.length) {
        el.appendChild(h('div', { class: 'enunciado', style: 'margin-top:12px' }, 'Errores con confianza de 80 % o más (los que más penalizan)'));
        caros.forEach(function (r) {
          el.appendChild(h('div', { class: 'fb mal', html: '<b>' + r.v.op[r.elegido] + ' al ' + Math.round(r.p * 100) + ' %.</b> Final: ' + r.v.final + ' Aporte a Brier: ' + F((r.p) * (r.p), 2) + '. ' + r.v.leccion }));
        });
      }
      reg.filter(function (r) { return !r.ok && r.p < 0.8; }).forEach(function (r) {
        el.appendChild(h('div', { class: 'fb info', html: '<b>' + r.v.op[r.elegido] + ' al ' + Math.round(r.p * 100) + ' %.</b> Final: ' + r.v.final + ' ' + r.v.leccion }));
      });
      if (dudas.length) el.appendChild(h('div', { class: 'fb info', html: '<b>Aciertos con 60 % o menos:</b> ' + dudas.length + '. Dudar de lo que se sabe también descalibra, aunque penaliza menos que la seguridad en el error.' }));
      el.appendChild(h('div', { class: 'pregunta-n', style: 'margin-top:8px' }, 'Después de 30 a 40 registros reales, este mismo análisis muestra en qué tipo de casos se concentra su descalibración.'));

      /* Nota: Brier 0,15 o menos = 100 %; 0,20 = 80 %; 0,25 (moneda al aire) = 60 %; 0,40 o más = 0 %. */
      var nota = Math.max(0, Math.min(1, (0.40 - brier) / 0.25));
      api.fin(nota, 'Puntuación de Brier ' + F(brier, 2) + ' con ' + aciertos + ' de ' + reg.length + ' aciertos. Se aprueba con Brier de 0,20 o menos.', true);
    }
    vineta();
  }

  function evaluador(el, api) {
    var h = api.h, F = api.fmt;
    var lista = api.barajar(PACIENTES), i = 0, puntos = 0, max = 0;
    function mostrar() {
      el.innerHTML = '';
      if (i >= lista.length) {
        var nota = puntos / max;
        return api.fin(nota, F(puntos, puntos % 1 ? 1 : 0) + ' de ' + max + ' puntos: habilidades bien valoradas y conducta elegida en ' + lista.length + ' pacientes', true);
      }
      var P = lista[i], marca = {}, conducta = null, corregido = false;
      el.appendChild(h('div', { class: 'pregunta-n' }, 'Paciente ' + (i + 1) + ' de ' + lista.length));
      el.appendChild(h('h3', { style: 'margin:4px 0' }, P.titulo));
      el.appendChild(h('div', { class: 'caja escena', style: 'margin:8px 0', html: P.situacion }));
      el.appendChild(h('div', { class: 'fila', style: 'gap:6px' },
        h('span', { class: 'cifra' }, h('small', null, 'Decisión en juego'), P.decision),
        h('span', { class: 'cifra' }, h('small', null, 'Riesgo de la decisión'), P.riesgo)));
      el.appendChild(h('div', { class: 'enunciado', style: 'margin-top:10px' }, '1. Valore cada habilidad según la respuesta'));
      var filas = HABILIDADES.map(function (hab, k) {
        var bots = ['Conservada', 'Comprometida'].map(function (t, v) {
          return h('button', { onclick: function () {
            if (corregido) return;
            marca[k] = v === 0;
            bots.forEach(function (b, bi) { b.classList.toggle('sel', bi === v); });
          } }, t);
        });
        var f = h('div', { class: 'item-clas' },
          h('div', { class: 'txt' }, (k + 1) + '. ' + hab),
          h('div', { style: 'font-size:14.5px;margin-bottom:6px' }, h('span', { class: 'pregunta-n' }, 'Pregunta: '), P.preguntas[k], h('br'), h('span', { class: 'pregunta-n' }, 'Respuesta: '), h('i', null, P.respuestas[k])),
          h('div', { class: 'bots' }, bots));
        el.appendChild(f); return f;
      });
      el.appendChild(h('div', { class: 'enunciado', style: 'margin-top:12px' }, '2. Elija la conducta'));
      var bc = CONDUCTAS.map(function (c, k) {
        var b = h('button', { class: 'opcion', onclick: function () {
          if (corregido) return;
          conducta = k;
          bc.forEach(function (x, xi) { x.classList.toggle('sel', xi === k); });
        } }, c);
        el.appendChild(b); return b;
      });
      var aviso = h('span', { class: 'pregunta-n' });
      var zona = h('div');
      var bt = h('button', { class: 'btn', onclick: function () {
        if (Object.keys(marca).length < 4 || conducta === null) { aviso.textContent = 'Valore las cuatro habilidades y elija una conducta.'; return; }
        corregido = true; bt.disabled = true; aviso.textContent = '';
        var p = 0;
        filas.forEach(function (f, k) {
          var ok = marca[k] === P.ok[k]; if (ok) p++;
          f.classList.add(ok ? 'bien' : 'mal');
          if (!ok) f.appendChild(h('div', { class: 'porque' }, h('b', null, 'Correcto: ' + (P.ok[k] ? 'conservada.' : 'comprometida.'))));
        });
        var okC = conducta === P.conducta;
        bc.forEach(function (b, k) { b.disabled = true; if (k === P.conducta) b.classList.add('bien'); else if (k === conducta) b.classList.add('mal'); });
        if (okC) p += 2;
        puntos += p; max += 6;
        zona.appendChild(h('div', { class: 'fb ' + (p === 6 ? 'bien' : p >= 4 ? 'info' : 'mal'), html: '<b>' + p + ' de 6 puntos.</b> ' + P.exp }));
        zona.appendChild(h('div', { class: 'fb info' }, h('b', null, 'Registro modelo en cinco líneas'), h('ol', { style: 'margin:6px 0 0;padding-left:20px' }, P.registro.map(function (r) { return h('li', null, r); }))));
        zona.appendChild(h('div', { class: 'acciones' }, h('button', { class: 'btn', onclick: function () { i++; mostrar(); } }, i + 1 < lista.length ? 'Siguiente paciente' : 'Ver resultado')));
      } }, 'Corregir');
      el.appendChild(h('div', { class: 'acciones' }, bt, aviso));
      el.appendChild(zona);
    }
    mostrar();
  }
